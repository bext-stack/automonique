# SPDX-License-Identifier: Elastic-2.0

# The acceptance and parity harnesses under `tools/` carry their own tests, and
# those tests hold promises no green run makes visible: that no live work
# coordinate reaches a report, that a check reports `passed` only for an
# observation it made, and that no automated result can mark an operator step
# satisfied. Until this workflow existed those tests were never run by CI, which
# is exactly the shape of defect they are written to catch.

name: tools

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # `-v` prints one line per test, so a run that silently collected fewer
      # tests than the tree defines is visible in the log rather than hidden
      # behind a green tick.
      - name: Harness tests
        run: python3 -m unittest discover --start-directory tools --pattern 'test_*.py' --top-level-directory . --verbose

  cockpit-browser-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/crates/automonique-web-entry
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install pinned browser test dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: bunx playwright install --with-deps chromium
      - name: Desktop and mobile workspace browser checks
        run: bun run test:browser --workers=2
      # Use the maintained live assertions against a local proof document.
      # No deployment credential or network mutation belongs in this job.
      - name: Attention render acceptance proof
        run: AUTOMONIQUE_LIVE_COCKPIT_PROOF_DOCUMENT="$PWD/fixtures/cockpit-render-proof-v1.json" bun run test:browser:live
