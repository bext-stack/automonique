# SPDX-License-Identifier: Elastic-2.0

name: identity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The number of unsupported identity claims this repository is knowingly
  # carrying, pending the owner action recorded in
  # plan/owner-decisions/2026-08-15-identity-register-reconciliation.md.
  #
  # This is a baseline, not a mute. The job fails if the count goes UP — a new
  # unregistered identity or a new attribution trailer is refused today, which
  # is the enforcement this workflow exists to provide. It also fails if the
  # count goes DOWN, because a baseline nobody has to maintain is a baseline
  # that rots: the moment the owner registers, this number becomes 0 in the
  # same change, and from then on the job is an ordinary green-or-red check.
  EXPECTED_UNSUPPORTED: '7'

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      # `read_commits` walks all of `git log HEAD`. A shallow clone would make
      # the check measure a handful of commits and pass for the wrong reason.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The checker's own coverage. `test_repository_passes` is the live
      # positive control over the real repository, so it fails for exactly the
      # reason the step below reports; any OTHER failure is a defect in the
      # checker and fails the job.
      #
      # No GPG keyring is imported anywhere in this workflow, deliberately.
      # `check_signing` selects the commits that must verify by author, and the
      # only signed commits here are authored by a non-signing identity, so
      # `git verify-commit` is never invoked. A check that passes only because
      # CI fetched a public key at runtime is a weak link worth not building.
      - name: Run the identity checker's own tests
        run: |
          set -uo pipefail
          output=$(python3 -m unittest discover -s .github/identity 2>&1) && status=0 || status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            if [ "$EXPECTED_UNSUPPORTED" != "0" ]; then
              echo "::error::The checker's tests now pass, so EXPECTED_UNSUPPORTED must be 0."
              exit 1
            fi
            exit 0
          fi
          if ! printf '%s' "$output" | grep -q 'FAILED (failures=1)'; then
            echo "::error::The identity checker's tests failed in more than the one known-pending way."
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'test_repository_passes'; then
            echo "::error::The identity checker's tests failed for a reason other than the live positive control."
            exit 1
          fi
          echo "::warning::Only the live positive control failed, which is the pending register state reported below."

      - name: Check every identity claim against Git
        run: |
          set -uo pipefail
          output=$(python3 .github/identity/check_identity.py 2>&1) && status=0 || status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            count=0
          else
            count=$(printf '%s' "$output" | sed -n 's/^\([0-9]\{1,\}\) identity claim(s) unsupported$/\1/p')
          fi
          if [ -z "$count" ]; then
            echo "::error::The checker failed without reporting a claim count; it could not run."
            exit 1
          fi
          {
            echo "## Identity register"
            echo
            echo "Unsupported claims: **$count** (expected $EXPECTED_UNSUPPORTED)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt "$EXPECTED_UNSUPPORTED" ]; then
            echo "::error::$count unsupported identity claims, up from the recorded $EXPECTED_UNSUPPORTED. This change introduced one."
            exit 1
          fi
          if [ "$count" -lt "$EXPECTED_UNSUPPORTED" ]; then
            echo "::error::Only $count unsupported claims remain, below the recorded $EXPECTED_UNSUPPORTED. Lower EXPECTED_UNSUPPORTED in this workflow in the same change that fixed them."
            exit 1
          fi
          if [ "$count" -ne 0 ]; then
            echo "::warning::$count identity claims remain unsupported, pending owner registration. See plan/owner-decisions/2026-08-15-identity-register-reconciliation.md. This job is NOT evidence that the register is truthful."
            echo "Pending owner registration — see plan/owner-decisions/2026-08-15-identity-register-reconciliation.md" >> "$GITHUB_STEP_SUMMARY"
          fi
