# SPDX-License-Identifier: Elastic-2.0

name: scrub

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run scrub self-tests on demand
        if: github.event_name == 'workflow_dispatch'
        run: python3 -m unittest discover -s tools/scrub -p 'test_*.py'

      - name: Scan the current tree
        run: python3 tools/scrub/scan.py --scope tree

  publication-scrub:
    # Protected fingerprints are an explicit publication check, not an
    # ordinary development prerequisite.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: scrub-publication
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Scan with protected fingerprints or fail closed
        env:
          AUTOMONIQUE_SCRUB_PROTECTED_RULES_B64: ${{ secrets.AUTOMONIQUE_SCRUB_PROTECTED_RULES_B64 }}
          AUTOMONIQUE_SCRUB_HMAC_KEY_B64: ${{ secrets.AUTOMONIQUE_SCRUB_HMAC_KEY_B64 }}
        run: python3 tools/scrub/scan.py --require-protected
