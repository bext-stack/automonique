# SPDX-License-Identifier: Elastic-2.0

name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    env:
      # On a runner a missing JavaScript toolchain is a broken job definition,
      # not a fact about the environment. Without this the protocol suite's
      # cross-language and codegen checks print a `GAP:` note and pass, which
      # is the same colour in a log as measuring them.
      AUTOMONIQUE_REQUIRE_JS_TOOLCHAIN: "1"
    steps:
      - uses: actions/checkout@v4

      # No version here on purpose. `rust/rust-toolchain.toml` is the pin, and
      # a bare `rustup toolchain install` under that directory reads the
      # channel, profile and components out of it. Spelled inline, the version
      # a contributor builds with and the version CI gates on would be two
      # facts that merely happen to agree.
      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install

      # The protocol suite shells out to a JavaScript runtime and to
      # `npx --offline tsc`, so both are pinned rather than inherited. bun is
      # the runtime `generated/VERDICT.md` recorded its measurements under; the
      # compiler is an exact devDependency of each SDK package, because the
      # negative cases assert exact TypeScript diagnostic text and a compiler
      # major version can reword any of those sentences.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # node is here for `npx`, which is what resolves the pinned compiler out
      # of the package's own node_modules.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Install the pinned JavaScript toolchain
        working-directory: sdk/typescript/packages
        run: |
          for package in protocol lab; do
            (cd "$package" && bun install --frozen-lockfile)
          done

      - name: The compiler is the pin, not whatever the runner supplies
        working-directory: sdk/typescript/packages/protocol
        run: |
          npx --offline tsc --version

      - name: Locked workspace checks
        working-directory: rust
        run: |
          cargo fetch --locked
          cargo metadata --no-deps --offline --locked --format-version 1 >/dev/null
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --offline --locked
          cargo test --workspace --all-targets --offline --locked
          cargo clippy --workspace --all-targets --offline --locked -- -D warnings

      - name: Lockfile is reproducible offline
        working-directory: rust
        run: |
          cp Cargo.lock /tmp/automonique-Cargo.lock
          cargo generate-lockfile --offline
          cmp /tmp/automonique-Cargo.lock Cargo.lock

      - name: TypeScript surface
        working-directory: sdk/typescript/packages
        run: |
          (cd protocol && npm run typecheck)
          (cd lab && npm run typecheck)
          (cd lab && bun test ./test)

      - name: Build the binary the interop test drives
        working-directory: rust
        run: cargo build --offline --locked -p automonique-lab --bins

      # The one check that runs both implementations against each other rather
      # than each against a fixture. It is double-gated in the test file, so
      # nothing outside this step and a deliberate local run ever executes it.
      - name: Rust and TypeScript interoperate over the real transport
        working-directory: sdk/typescript/packages/lab
        env:
          AUTOMONIQUE_RUN_RUST_INTEROP: "1"
          AUTOMONIQUE_LAB_BIN: ${{ github.workspace }}/rust/target/debug/automonique-lab
        run: bun test ./test/rust-interop.test.ts

      # `generated/VERDICT.md` constraint 5. Reproducibility is asserted by the
      # crate's own tests; that the checked-in tree was regenerated is a claim
      # no test inside the tree can make, because a test cannot see the commit.
      - name: Regenerate the TypeScript surface
        working-directory: rust
        env:
          AUTOMONIQUE_PROTOCOL_REGENERATE: "1"
        run: cargo test --offline --locked -p automonique-protocol --test codegen

      - name: Regeneration changed nothing
        run: git diff --exit-code -- sdk/typescript/packages/protocol/generated/

      - name: Verify the systemd user service
        run: tools/verify_systemd_unit.sh

  # Report-only, and deliberately not in the required-check set: the floor is a
  # decision to make once the number is known, and an instrumented rebuild of
  # the whole workspace does not belong on the pull-request critical path.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install

      # `llvm-tools-preview` arrives with the toolchain file; this is the
      # driver, at an exact version and prebuilt rather than `cargo install`.
      - uses: taiki-e/install-action@v2.86.1
        with:
          tool: cargo-llvm-cov@0.8.7

      # `--ignore-run-fail` is doing something specific and is not a shrug at
      # red tests. `automonique-lab`'s `build_limits` suite exists to prove the
      # broker constrains a child process — an 8 KiB file-size rlimit, a CPU
      # second budget, a wall clock. Under instrumentation that child is also
      # writing a `.profraw` file far larger than the limit it is being held to,
      # so every one of those seven tests reports `Failed` where it expects
      # `CpuLimit` or `WallLimit`. That is the instrumentation colliding with
      # the property under test, not a regression, and there is no version of
      # this job that both instruments the child and leaves its limits intact.
      # The uninstrumented run in the `workspace` job above is what gates on
      # those tests; this job only needs a number.
      - name: Coverage summary
        working-directory: rust
        run: |
          cargo fetch --locked
          cargo llvm-cov --workspace --locked --offline --summary-only --ignore-run-fail

      # From the profile data the run above already produced, so this costs a
      # report rather than a second instrumented build.
      - name: Coverage report
        working-directory: rust
        run: cargo llvm-cov report --lcov --output-path target/lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: rust/target/lcov.info
          if-no-files-found: error
