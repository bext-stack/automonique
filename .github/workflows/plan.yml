# SPDX-License-Identifier: Elastic-2.0

name: source-policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Path-aware SPDX boundary
        run: python3 tools/check_licenses.py

      - name: Licence checker negative controls
        run: python3 -m unittest -v tools.test_check_licenses
