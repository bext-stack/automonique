# SPDX-License-Identifier: Elastic-2.0

name: source-policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licence-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Path-aware SPDX boundary
        run: python3 tools/check_licenses.py

      - name: Licence checker negative controls
        run: python3 -m unittest -v tools.test_check_licenses

  derived-artifacts:
    # Every derived artifact in this repository is generated from a prose source
    # by a checker that can also verify without writing. Until now none of them
    # ran anywhere: editing `feature-parity.md` without regenerating
    # `plan/ledgers/parity.json` was invisible, and 13 of the 14 top-level
    # `tools/test_*.py` files plus all of `tools/parity`, `tools/identifiers`,
    # `tools/oracle`, `tools/contract_inventory` and `tools/surface_inventory`
    # ran nowhere. This job is what makes doc-to-derived drift a red build.
    #
    # The plan-bookkeeping checkers `plan/check.py --verify` and
    # `plan/selftest.py` now run in the `plan-verifier` job below — M2 #15
    # wired these derived-artifact checkers; M5 #34 wired the bookkeeping
    # ones once the #4 scrub and the selftest baseline fix made them green.
    # `plan/check.py --identifiers` additionally runs in
    # `.github/workflows/scrub.yml` as the published-tree identifier rule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # The whole suite, not a list of modules: a new `tools/**/test_*.py` file
      # is picked up by being written, so nobody has to remember this file.
      # `-t tools` makes `tools/` the import root, which is how the packages
      # under it (`parity`, `identifiers`, `oracle`, ...) address each other.
      - name: Tools test suite
        run: python3 -m unittest discover -s tools -t tools -p 'test_*.py'

      # Each of these re-derives its artifact in memory and compares. None of
      # them writes without an explicit flag (`--write`, `--check`, `verify`
      # subcommand), which the "wrote nothing" step below re-proves rather than
      # trusting: a checker that quietly regenerated its own input would report
      # agreement with itself forever.
      - name: Parity ledger matches feature-parity.md
        run: python3 tools/parity/ledger.py

      # Not a derived artifact but the same class of claim: an enumeration that
      # would otherwise decay into a false statement about what has been
      # verified. It refuses a scope claiming a comparison the tree cannot
      # support, and fails if a cited effect seam is renamed out from under it.
      - name: Live parity scopes match the code and the ledger
        run: python3 tools/parity/live_scopes.py

      - name: Identifier inventory matches the permitted corpus
        run: python3 tools/identifiers/inventory.py verify

      - name: Contract inventory matches its permitted sources
        run: python3 tools/contract_inventory/check.py

      - name: Surface inventory derived views current
        run: python3 tools/surface_inventory/verify.py

      - name: Capability ledger keyed and scheduled
        run: python3 tools/capability_ledger.py

      - name: Oracle boundary document matches its vocabulary
        run: python3 tools/oracle/check_boundary.py

      # The verify modes above are only worth running if they are read-only.
      # If any step regenerated an artifact instead of comparing against it,
      # the diff appears here and this job fails rather than passing on a
      # freshly written copy of whatever it was supposed to be checking.
      - name: Prove the checkers wrote nothing
        run: |
          set -euo pipefail
          if ! git diff --exit-code; then
            echo "::error::A verify-mode checker modified the working tree. Verify mode must compare, never regenerate."
            exit 1
          fi

  plan-verifier:
    # The plan-bookkeeping verifier and its own self-test. `selftest.py`
    # mutates a scratch copy of the tree and asserts `check.py` detects each
    # drift (its baseline control was inert until the #4 scrub + a two-line
    # scratch fix); `check.py --verify` asserts the tree's integrity rules
    # (SPDX boundary, identifier-location, evidence completeness) hold. Both
    # went green after M1/M2; wiring them here (M5 #34) makes plan drift and
    # a mislocated identifier a red build rather than a manual check.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Plan verifier self-test
        run: python3 plan/selftest.py

      - name: Plan integrity rules hold
        run: python3 plan/check.py --verify
