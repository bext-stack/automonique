# SPDX-License-Identifier: Elastic-2.0
#
# The identities this repository claims — and, more importantly, the ones it
# does not. `.github/identity/check_identity.py` refuses any claim here that
# Git does not support, so this file cannot flatter the repository.
#
# Every key below is required and every value comes from a closed set. An
# unknown key, an unknown enum value or an unbacked claim is refused at parse
# rather than discouraged in prose.

schema = "automonique.identity-register/v1"

# The claim `GATE-IDENTITY` exists to judge. `true` requires every governance
# role to be held by its own `dedicated` identity with a distinct, non-empty
# credential fingerprint. It is `false` because one identity does every job.
separation_claimed = false

# The commit at which `AGENTS.md` § Git authority began requiring the candidate
# identity. Every `historical_exception` must be an ancestor of it, so a new
# non-conforming commit cannot be excused without also moving this line.
rule_effective_commit = "868a97d33fb16d9760b93ec91c6a91a4f994da22"

# Empty means commit signing is not enabled, and the checker then requires that
# no commit carries a signature. A non-empty value is the commit from which
# signatures are required and verified.
signing_effective_commit = ""

# --------------------------------------------------------------------------
# Identities
#
# `roles` are the roles GOVERNANCE.md § Roles defines; the checker reads them
# from that document rather than restating them, so adding a role there without
# assigning it here fails.
#
# `separation = "dedicated"` is a claim of identity separation and requires one
# role, a signing method, and a fingerprint no other identity holds.
# `separation = "shared"` is the truthful description of one credential doing
# several jobs.

[[identity]]
id = "candidate"
name = "Automonique Candidate"
email = "candidate@automonique.invalid"
roles = ["implementer", "reviewer", "fixer", "builder", "merger"]
separation = "shared"
signing = "none"
fingerprint = ""
commits = true

# --------------------------------------------------------------------------
# Historical exceptions
#
# Commits that predate the rule. `plan/contracts/BOOT-002.md` puts migrating
# existing history out of scope: the root commit's authorship is a fact, and it
# is recorded here rather than rewritten. Each entry is pinned to an exact
# commit, must still violate the rule, and must be an ancestor of
# `rule_effective_commit` — a stale or forward-looking exception is refused.

[[historical_exception]]
commit = "1a116ee2473cdd6c28f9c206e612e4ed64d54b2b"
reason = "root commit, authored before AGENTS.md required the candidate identity; its authorship is a fact of the clean-room boundary recorded in PROVENANCE.md"

[[historical_exception]]
commit = "972f94894dc84921454bfdde131c9fa8efa57ec2"
reason = "second bootstrap commit, same pre-rule owner identity as the root commit"

[[historical_exception]]
commit = "69db4ca85c1ab1aab7ad3fe3e9225bf0f33db055"
reason = "made with ordinary git before the rule existed, so it inherited the ambient personal Git configuration; the identity is not reproduced here because AGENTS.md forbids committing a personal name or email address, and the commit object remains the authoritative record"
