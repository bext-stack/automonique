# SPDX-License-Identifier: Elastic-2.0
name: Owner decision
description: A choice only the repository owner can make (authority, licensing, identity, visibility, credentials).
labels: ["owner-decision"]
body:
  - type: textarea
    id: decision
    attributes:
      label: Decision needed
      description: State the single question to be decided.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
      description: Each option with its tradeoffs. Mark the recommended one.
    validations:
      required: true
  - type: input
    id: chosen
    attributes:
      label: Chosen option
      description: Filled in when the owner decides.
  - type: input
    id: provenance
    attributes:
      label: Provenance
      description: Where the decision is recorded (e.g. plan/owner-decisions/YYYY-MM-DD-slug.md). Do not paste private identifiers or credentials into this public issue.