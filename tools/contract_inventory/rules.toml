# SPDX-License-Identifier: Elastic-2.0
#
# Classification rules for the behavioural contract inventory (R0-01).
#
# This file carries the judgements, and only the judgements: which of the seven
# surface classes a family of observations belongs to, which Rust destination
# the porting map resolves it to, and what a parity fixture for it would look
# like. Every fact — the members of a family, the counts, the ledger's own
# target owners — is read out of the permitted sources at generation time and
# is never written down here.
#
# Two rules keep this file from becoming a place where claims accumulate:
#
#   * every `porting_map_row` must exist in the porting map, and the owner it
#     resolves to must appear in that row's destination cell, so an invented
#     destination is refused rather than discouraged;
#   * every `quote` must be found in the section it cites, so a declared entry
#     that the source does not evidence is refused.
#
# `tools/contract_inventory/check.py` enforces both.

schema = "automonique.contract-inventory.rules/v1"

# ---------------------------------------------------------------------------
# Families extracted mechanically from a permitted source.
# ---------------------------------------------------------------------------

[family.dashboard-route]
title = "dashboard API route"
granularity = "surface"
extraction = "table-cell-backticks"
source = "legacy-inventory"
section = "## Dashboard API"
group_column = 0
token_column = 1
claim_pattern = "^(\\d+) routes\\."
surface_class = "input"
owner = "automonique-web"
owner_via = "porting-map"
porting_map_row = "`dashboard.ts`, `term.ts`, `runs.ts`"
owner_note = "the row lists the web crate alongside SDK, TUI and CLI surfaces; automonique-web is its only crate destination"
fixture_class = "enumeration-presence"
fixture_inputs = "an authorized operator request to {name}"
fixture_outputs = "the response contract for {name} and any durable or outbox effect it commits"

