# Observations that fit none of the seven classes. They are listed, never
# forced into the nearest class, and they carry no owner or fixture plan
# because an unclassified observation has no behaviour to plan a fixture for.
# ---------------------------------------------------------------------------

[[unclassified]]
id = "configuration-surface"
name = "the configuration surface: environment variables and the runtime-mutable settings file"
source = "legacy-inventory"
section = "## Configuration surface"
quote = "classifies each as durable, compatibility-only or presentation-only"
why_no_class = "a configuration name is neither behaviour nor an operational script; it parameterises behaviour that is inventoried elsewhere, and forcing it into a behavioural class would double-count the behaviour it configures"
disposition = "deferred: the identifier inventory classifies every configuration name over its own closed vocabulary"

