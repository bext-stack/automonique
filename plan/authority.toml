# SPDX-License-Identifier: Elastic-2.0

schema = "automonique.authority/v1"
mode = "owner-supervised-bootstrap"
decision = "plan/owner-decisions/2026-08-09-owner-supervised-bootstrap.md"
decision_base = "0a33948a577869155e0f4bfe5df028599773e37a"

# Capabilities available to a bounded worker in this mode.
run_required_checks = true
run_gate_preflight = true
create_candidate_branch = true
create_local_candidate_commit = true

# These remain external regardless of bootstrap mode.
push = false
merge_protected_branch = false
administer_repository = false
sign_release = false
publish_package = false
deploy_production = false

# Review is selected by risk while an owner is supervising. It becomes
# independently mandatory before autonomous protected-branch integration.
review_policy = "owner-configurable"
