# SPDX-License-Identifier: Elastic-2.0

schema = "automonique.authority/v1"
mode = "autonomous-protected-integration"
decision = "plan/owner-decisions/2026-08-10-autonomous-protected-integration.md"
decision_base = "e2b4b60b87502286a9622513902a38b765963da8"

# Capabilities available to a bounded worker in this mode.
run_required_checks = true
run_gate_preflight = true
create_candidate_branch = true
create_local_candidate_commit = true
advance_verified_local_main = true
publish_verified_origin_main_fast_forward = true

# The two integration capabilities above are deliberately narrower than a
# generic merge or push capability. Both require the exact verified candidate,
# expected-tip compare-and-swap, fast-forward ancestry and an idempotent receipt.
local_main_ref = "refs/heads/main"
publication_remote = "origin"
publication_ref = "refs/heads/main"
require_exact_tree_verification = true
require_fast_forward = true
require_expected_tip = true

# No class of leased change is reserved for owner sign-off. A verified candidate
# integrates through the fast-forward path above whatever it touches, including
# the plan, governance and authority surface. The exact-tree, expected-tip and
# fast-forward controls above are retained: they prevent drift, not autonomy.
protected_control_self_certification = true

# Generic or higher-impact operations remain external regardless of authority
# mode. `push = false` prohibits every push except the single configured
# fast-forward capability above, which is sufficient for autonomous progress.
push = false
merge_protected_branch = false
administer_repository = false
sign_release = false
publish_package = false
deploy_production = false
force_update = false
history_rewrite = false
edit_remote = false
other_ref_update = false
other_remote_update = false

# Review is selected by risk and stays owner-configurable under autonomous
# integration. Evidence records the actual reviewer count and never claims an
# independence that did not occur.
review_policy = "owner-configurable"
