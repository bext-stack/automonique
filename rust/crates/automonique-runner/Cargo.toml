# SPDX-License-Identifier: Elastic-2.0

[package]
name = "automonique-runner"
version = "0.1.0"
edition = "2024"
license = "Elastic-2.0"
publish = false

[dependencies]
automonique-protocol = { path = "../automonique-protocol" }
fuser = { workspace = true }
landlock = { workspace = true }
seccompiler = { workspace = true }
nix = { version = "=0.29.0", default-features = false, features = ["fs", "poll", "process", "ptrace", "resource", "sched", "signal", "socket", "uio", "user"] }
# Receives the `/dev/fuse` descriptor from `fusermount3` over `SCM_RIGHTS` as
# an `OwnedFd` without any `unsafe`; `thread` is the user-namespace and
# capability surface the workload identity switch uses, and `mount` is the
# `mount(2)` the launch helper performs inside the workload's own namespaces —
# both without `unsafe`, which this workspace forbids.
rustix = { workspace = true, features = ["mount", "thread"] }
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
