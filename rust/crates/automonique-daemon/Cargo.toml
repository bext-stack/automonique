# SPDX-License-Identifier: Elastic-2.0

[package]
name = "automonique-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The provider grammar, for the one thing this daemon does with a live run's
# stdout: normalize it. The dependency runs this way because it cannot run the
# other — `automonique-agents` depends on `automonique-runner`, so the runner
# cannot own a normalizer, and the daemon is the composition root that holds
# both. See `progress`. No third-party crate enters the graph with it.
automonique-agents = { path = "../automonique-agents" }
automonique-core = { path = "../automonique-core" }
# The execution lane starts one loopback CONNECT broker per run that needs
# egress, so the daemon composes the broker rather than merely describing one.
automonique-egress-broker = { path = "../automonique-egress-broker" }
automonique-github-connector = { path = "../automonique-github-connector" }
automonique-lab = { path = "../automonique-lab" }
automonique-observability = { path = "../automonique-observability" }
# The socket's peer rule and the approval requirement lattice are both pure
# classification over caller-supplied observations, so both live in the policy
# crate rather than being spelled again here.
automonique-policy = { path = "../automonique-policy" }
automonique-protocol = { path = "../automonique-protocol" }
automonique-runner = { path = "../automonique-runner" }
# The two Slack commands on the Telegram surface read and post through this
# client. It is behind an enablement gate of the same shape the support fleet
# has: an unconfigured daemon composes no client and can reach Slack at all.
# See `slack`.
automonique-slack-connector = { path = "../automonique-slack-connector" }
automonique-store = { path = "../automonique-store" }
# The ticket intake worker consumes the fleet client and the typed SupportIssue
# it decodes. It is behind an enablement gate: an unconfigured daemon composes
# no client and starts no worker. See `ticket_intake`.
automonique-support-connector = { path = "../automonique-support-connector" }
automonique-transport-runtime = { path = "../automonique-transport-runtime" }
# The transport runtime's poller is parameterized by the access policy this
# crate defines, and does not re-export it: a host cannot construct a poller
# without naming these types.
automonique-transports = { path = "../automonique-transports" }
listenfd.workspace = true
nix.workspace = true
rusqlite.workspace = true
rustix.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
toml_edit.workspace = true
ureq.workspace = true

[dev-dependencies]
automonique-platform-client = { path = "../../../sdk/rust/platform-client" }
tempfile.workspace = true

[features]
# Typed fault injection for the generation handoff, consumed by the process-
# level failure-matrix tests in the `automonique` binary crate. Off in every
# shipping build, and a daemon built without it refuses to open while the
# fault environment variable is set. See `reload_faults`.
reload-fault-injection = []

[lints]
workspace = true
