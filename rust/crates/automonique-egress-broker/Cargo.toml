[package]
name = "automonique-egress-broker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The `CONNECT` half of this crate stays dependency-free on purpose: a tunnel
# that moves opaque bytes needs no parser and no key. `nix` is the one exception
# and belongs to neither route: it is the `poll(2)` both accept loops wait on,
# a syscall wrapper that parses nothing and holds no key. The rest belong
# exclusively to the identity-bound provider path, and their presence is the
# visible signal that one route through this crate does terminate TLS.
[dependencies]
hex = { workspace = true }
nix = { workspace = true }
rustls = { workspace = true }
subtle = { workspace = true }
webpki-roots = { workspace = true }
zeroize = { workspace = true }

[lints]
workspace = true
