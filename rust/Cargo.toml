# SPDX-License-Identifier: Elastic-2.0

[workspace]
members = ["crates/automonique-lab"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Elastic-2.0"
publish = false

[workspace.dependencies]
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde_json = "=1.0.149"
tempfile = "=3.24.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "forbid"
todo = "forbid"
unimplemented = "forbid"
