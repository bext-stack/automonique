# SPDX-License-Identifier: Elastic-2.0

[workspace]
members = [
    "crates/automonique-acp",
    "crates/automonique-agents",
    "crates/automonique-backup",
    "crates/automonique",
    "crates/automonique-cli",
    "crates/automonique-chat-provider",
    "crates/automonique-connector-substrate",
    "crates/automonique-core",
    "crates/automonique-daemon",
    "crates/automonique-egress-broker",
    "crates/automonique-github-connector",
    "crates/automonique-lab",
    "crates/automonique-observability",
    "crates/automonique-policy",
    "crates/automonique-protocol",
    "crates/automonique-runner",
    "crates/automonique-sandbox",
    "crates/automonique-slack-connector",
    "crates/automonique-store",
    "crates/automonique-support-connector",
    "crates/automonique-transport-runtime",
    "crates/automonique-transports",
    "crates/automonique-web-entry",
]
# `fuzz/` is a crate, and a sibling of `crates/`, but not a member. It needs
# nightly and a sanitizer build, and its entry-point macro emits the `extern
# "C"` symbol `unsafe_code = "forbid"` below exists to reject. Excluding it
# keeps this lockfile — and the reproducibility check over it — independent of
# anything under `fuzz/`. See `fuzz/README.md`.
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Elastic-2.0"
publish = false

[workspace.dependencies]
agent-client-protocol = "=2.0.0"
base64 = "=0.22.1"
blocking = "=1.6.2"
# MIT. Default features only: nothing links libfuse. The runner speaks the
# `/dev/fuse` protocol itself over a descriptor `fusermount3` hands it, so the
# crate is a protocol codec and dispatch loop, not a binding.
fuser = { version = "=0.18.0", default-features = false }
futures = "=0.3.32"
hex = "=0.4.3"
httparse = "=1.10.1"
landlock = "=0.4.7"
listenfd = "=1.0.2"
seccompiler = "=0.5.0"
log = { version = "=0.4.33", features = ["max_level_debug", "release_max_level_debug"] }
nix = { version = "=0.29.0", default-features = false, features = ["fs", "poll", "process", "resource", "signal", "socket", "time", "user"] }
rusqlite = { version = "=0.32.1", features = ["backup", "bundled"] }
# Terminating TLS towards a provider is the whole point of the identity-bound
# egress path, so the broker links a TLS library deliberately and visibly.
# `ring` rather than the default provider: it is the one already vendored for
# this workspace, so the direct dependency adds no new transitive crate.
rustls = { version = "=0.23.43", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustix = { version = "=1.1.4", features = ["net"] }
serde = "=1.0.229"
serde_json = "=1.0.149"
sha2 = "=0.10.9"
subtle = "=2.6.1"
tempfile = "=3.24.0"
toml_edit = { version = "=0.25.13", default-features = false, features = ["parse"] }
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
webpki-roots = "=1.0.9"
zeroize = "=1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "forbid"
todo = "forbid"
unimplemented = "forbid"

# Provider executables are hashed before composition and again before launch.
# Keep the RustCrypto implementation fast in the development daemon so those
# large-file checks complete well inside the short transport lease.
[profile.dev.package.sha2]
opt-level = 3
