# SPDX-License-Identifier: Elastic-2.0

[workspace]
members = [
    "crates/automonique",
    "crates/automonique-cli",
    "crates/automonique-core",
    "crates/automonique-daemon",
    "crates/automonique-lab",
    "crates/automonique-policy",
    "crates/automonique-protocol",
    "crates/automonique-runner",
    "crates/automonique-sandbox",
    "crates/automonique-store",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Elastic-2.0"
publish = false

[workspace.dependencies]
hex = "=0.4.3"
nix = { version = "=0.29.0", default-features = false, features = ["fs", "process", "resource", "signal", "socket", "user"] }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.24.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "forbid"
todo = "forbid"
unimplemented = "forbid"
